<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employee Knowledge Portal</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --border: #2a3348;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .page { width: 100%; max-width: 1000px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }

  .layout { display: flex; gap: 20px; align-items: flex-start; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .sidebar { width: 280px; flex: none; }
  .sidebar h3 {
    margin-top: 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .doc-list { display: flex; flex-direction: column; gap: 6px; }
  .doc-item {
    text-align: left;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
  }
  .doc-item:hover { border-color: var(--accent); }
  .doc-item.active { border-color: var(--accent); background: rgba(91,140,255,0.12); }

  .viewer { flex: 1; min-height: 320px; }
  .viewer h2 { margin-top: 0; font-size: 1.1rem; }
  .viewer-text { line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; color: var(--text); }

  .empty-hint { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Employee Knowledge Portal</h1>
    <p>Browse company policies, technical guides, and operational procedures.</p>
  </header>

  <div class="layout">
    <div class="panel sidebar">
      <h3>Documents</h3>
      <div class="doc-list" id="doc-list">
        <span class="empty-hint">Loading...</span>
      </div>
    </div>

    <div class="panel viewer" id="viewer">
      <span class="empty-hint">Select a document to read it.</span>
    </div>
  </div>
</div>

<script>
let activeDocId = null;

async function loadDocList() {
  const el = document.getElementById("doc-list");
  try {
    const res = await fetch("/api/docs");
    const docs = await res.json();
    el.innerHTML = "";
    docs.forEach((d) => {
      const btn = document.createElement("button");
      btn.className = "doc-item";
      btn.textContent = d.title;
      btn.onclick = () => openDoc(d.doc_id, btn);
      el.appendChild(btn);
    });
  } catch (e) {
    el.innerHTML = '<span class="empty-hint">Could not load document list.</span>';
  }
}

async function openDoc(docId, btnEl) {
  document.querySelectorAll(".doc-item").forEach((b) => b.classList.remove("active"));
  btnEl.classList.add("active");
  activeDocId = docId;

  const viewer = document.getElementById("viewer");
  viewer.innerHTML = '<span class="empty-hint">Loading...</span>';

  try {
    const res = await fetch(`/api/docs/${docId}`);
    if (!res.ok) throw new Error("Document not found");
    const doc = await res.json();
    viewer.innerHTML = `<h2>${doc.title}</h2><div class="viewer-text"></div>`;
    viewer.querySelector(".viewer-text").textContent = doc.text;
  } catch (e) {
    viewer.innerHTML = `<span class="empty-hint">Could not load document: ${e.message}</span>`;
  }
}

loadDocList();
</script>
</body>
</html>
